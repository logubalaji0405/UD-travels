<!DOCTYPE html>
<html lang="en">

<head>
    {% load static %}

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{% block title %}UD-Traveler | Explore Tamil Nadu Travel Destinations{% endblock %}</title>

    <meta name="description"
          content="{% block meta_description %}Explore Tamil Nadu with UD-Traveler. Discover beautiful hills, beaches, heritage temples, tourist destinations and unforgettable travel experiences.{% endblock %}">

    <meta name="robots"
          content="{% block robots %}index, follow{% endblock %}">

    <link rel="canonical"
          href="{% block canonical %}https://udtravels.in/{% endblock %}">

    <link rel="icon" href="{% static 'images/favicon.ico' %}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    {% block content %}
    {% endblock %}

    {% include 'hf/footer.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
